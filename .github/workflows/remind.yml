name: Reminder sweep

# Free, hourly, and coarse: GitHub may start this a few minutes late, which is why the endpoint
# matches on the hour and sends once per device per day rather than at an exact minute.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder endpoint
        run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://couch-defector.vercel.app/api/remind
