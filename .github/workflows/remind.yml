name: Reminder sweep

# Free, every half hour, and coarse: GitHub may start a run a few minutes late. The endpoint sends from
# each user's chosen time, every half hour, until they log the workout or their day ends.
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the reminder endpoint
        # A block scalar: unquoted, the "Authorization: Bearer" colon made the whole file fail to parse.
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://couch-defector.vercel.app/api/remind
